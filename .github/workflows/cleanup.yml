name: Cleanup old builds
# One-off, run by hand (Actions > Cleanup old builds > Run workflow). Deletes the build artifacts of every run except the
# latest release's (they cost Actions storage: ~1.1 GB per release build), and every GitHub release except the latest one.
# Git tags are kept. Asked by the owner on 21 Nov 2026 («امسح حاجة kubenova بس سيب اخر release»).
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const rels = (await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100}))
              .filter(r => !r.draft).sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
            if (!rels.length) { core.setFailed("no releases"); return; }
            const keep = rels[0];
            const tagSha = (await github.rest.git.getRef({owner, repo, ref: `tags/${keep.tag_name}`})).data.object.sha;
            let keepSha = tagSha;
            try { keepSha = (await github.rest.git.getTag({owner, repo, tag_sha: tagSha})).data.object.sha; } catch (e) {}
            const target = keep.target_commitish;
            core.info(`keeping release ${keep.tag_name} (commit ${keepSha}, target ${target})`);
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
            let freed = 0, n = 0;
            for (const a of arts) {
              const sha = a.workflow_run && a.workflow_run.head_sha;
              if (sha === keepSha || sha === target) { core.info(`keep artifact ${a.name} (${a.size_in_bytes} B)`); continue; }
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: a.id}); freed += a.size_in_bytes; n++;
            }
            core.info(`deleted ${n} artifacts, ${(freed / 1e9).toFixed(2)} GB`);
            for (const r of rels.slice(1)) { await github.rest.repos.deleteRelease({owner, repo, release_id: r.id}); core.info(`deleted release ${r.tag_name}`); }
